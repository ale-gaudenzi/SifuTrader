name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  schedule:
    # Weekdays after the US close: refreshes the history snapshot.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Download history snapshot
        run: npm run history
        continue-on-error: true

      - name: Download fundamentals snapshot
        run: npm run fundamentals
        continue-on-error: true

      - name: Type-check and build
        run: npm run build

      # The site is private: Cloudflare Access must be enabled on the
      # workers.dev route (see README).
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
